name: any_core_vpn
description: >-
  Flutter VPN plugin with a unified Dart API for sing-box (singbox) and Xray-core on Android, Windows (in full version) and macOS. 
  Supports share links, JSON configs and routing.
repository: https://github.com/cybandg/any_core_vpn_demo
version: 0.8.1

topics:
  - vpn
  - singbox
  - xray
  - proxy
  - networking

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.blamurai.any_core_vpn
        pluginClass: AnyCoreVpnPlugin
      macos:
        pluginClass: AnyCoreVpnPlugin

  assets:
    - assets/geo/geosite.dat
    - assets/geo/geoip.dat