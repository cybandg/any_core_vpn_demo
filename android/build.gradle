group = "com.blamurai.any_core_vpn"
version = "1.0-SNAPSHOT"

apply plugin: "com.android.library"

// ---------------------------------------------------------------
// Derives compile/packaging artifacts from the EXACT AARs in libs/
// ---------------------------------------------------------------
def coreJarsDir = layout.buildDirectory.dir("core-libs")
def coreJniDir  = layout.buildDirectory.dir("core-jni")

tasks.register("prepareCoreLibs") {
    def libsDir = file("libs")
    inputs.dir(libsDir)
    outputs.dirs(coreJarsDir, coreJniDir)

    doLast {
        def jarsDir = coreJarsDir.get().asFile
        def jniDir  = coreJniDir.get().asFile
        jarsDir.deleteDir(); jniDir.deleteDir()
        jarsDir.mkdirs();    jniDir.mkdirs()

        def buildDirFile = layout.buildDirectory.get().asFile

        fileTree(dir: libsDir, include: ['*.aar']).each { aar ->
            def unpack = file("$buildDirFile/tmp-aar/${aar.name}")
            unpack.deleteDir(); unpack.mkdirs()
            copy { from zipTree(aar); into unpack }

            // 1. classes.jar -> core-libs/<aarName>.jar
            def classesJar = file("$unpack/classes.jar")
            if (classesJar.exists()) {
                def target = new File(jarsDir, aar.name.replace('.aar', '') + '.jar')
                if (aar.name.toLowerCase().contains('xray')) {
                    ant.zip(destfile: target) {
                        zipfileset(src: classesJar) { exclude(name: 'go/**') }
                    }
                } else {
                    ant.zip(destfile: target) {
                        zipfileset(src: classesJar)
                    }
                }
            }

            // 2. jni/<abi>/*.so -> core-jni/<abi>/*.so
            def jni = file("$unpack/jni")
            if (jni.exists()) copy { from jni; into jniDir }

            unpack.deleteDir()
        }
    }
}

def coreJars = fileTree(dir: coreJarsDir, include: ['*.jar'])
coreJars.builtBy "prepareCoreLibs"

android {
    namespace = "com.blamurai.any_core_vpn"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += "src/main/kotlin"
            jniLibs.srcDir coreJniDir
        }
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        ndk { abiFilters 'arm64-v8a' }
    }

    packaging {
        resources { excludes += ['META-INF/**'] }
    }
}

tasks.named("preBuild") { dependsOn "prepareCoreLibs" }

dependencies {
    implementation coreJars

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'

    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}